<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Escáner Pro" />
  <meta name="description" content="Escáner de documentos A4 profesional con corrección de perspectiva" />
  <title>Escáner PRO A4</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== SPLASH SCREEN ===== -->
  <div id="splash">
    <div class="splash-content">
      <div class="splash-icon">📄</div>
      <h1>Escáner PRO</h1>
      <p>Documentos A4 perfectos</p>
      <div class="splash-loader"><div></div></div>
    </div>
  </div>

  <!-- ===== MAIN APP ===== -->
  <div id="app" class="hidden">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="app-logo-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </span>
        <span class="app-title">Escáner <span class="pro-tag">PRO</span></span>
      </div>
      <div class="topbar-right">
        <button id="btnPages" class="badge-btn" title="Páginas escaneadas">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          <span id="pageCount" class="badge">0</span>
        </button>
        <button id="btnSettings" title="Configuración">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT VIEWS -->
    <main>

      <!-- ===== CAMERA VIEW ===== -->
      <section id="cameraView" class="view active">
        <div class="camera-wrapper">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="overlayCanvas"></canvas>
          <div id="cameraFrame" class="camera-frame">
            <div class="corner-handle tl" data-corner="tl"></div>
            <div class="corner-handle tr" data-corner="tr"></div>
            <div class="corner-handle bl" data-corner="bl"></div>
            <div class="corner-handle br" data-corner="br"></div>
          </div>
          <div id="docDetector" class="doc-overlay hidden"></div>
          <div class="camera-hints">
            <span id="hintText">Apunta a un documento A4</span>
          </div>
          <div id="flashOverlay" class="flash-overlay"></div>
        </div>

        <!-- CAMERA CONTROLS -->
        <div class="camera-controls">
          <!-- Top Row: Flash, Auto-Capture, Batch -->
          <div class="ctrl-row ctrl-row-top">
            <button id="btnFlash" class="ctrl-btn secondary" title="Linterna / Flash">
              <span class="icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
              </span>
              <span class="label">Flash</span>
            </button>
            <button id="btnAutoCapture" class="ctrl-btn secondary" title="Disparo Automático al detectar quietud">
              <span class="icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <circle cx="12" cy="12" r="6"></circle>
                  <circle cx="12" cy="12" r="2"></circle>
                </svg>
              </span>
              <span class="label">Auto-Disparo</span>
            </button>
            <button id="btnContinuous" class="ctrl-btn secondary" title="Modo Multipágina Rápido">
              <span class="icon">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="8" y="2" width="13" height="17" rx="2"></rect>
                  <path d="M4 6v14a2 2 0 0 0 2 2h11"></path>
                </svg>
              </span>
              <span class="label">Ráfaga</span>
            </button>
          </div>

          <!-- Bottom Main Row: Gallery, Shutter, View Pages -->
          <div class="ctrl-row ctrl-row-main">
            <button id="btnGallery" class="ctrl-btn secondary round" title="Importar imagen">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
            </button>
            <button id="btnCapture" class="capture-btn" title="Capturar">
              <div class="capture-inner"></div>
            </button>
            <button id="btnViewPages" class="ctrl-btn secondary round" title="Ver páginas">
              <span id="miniCount">0</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
            </button>
          </div>

          <!-- Mode Selector Strip (OneDrive style) -->
          <div class="mode-selector-wrap">
            <div class="mode-selector" id="modeSelector">
              <button class="mode-btn" data-mode="whiteboard">PIZARRA</button>
              <button class="mode-btn active" data-mode="document">DOCUMENTO</button>
              <button class="mode-btn" data-mode="card">TARJETA</button>
              <button class="mode-btn" data-mode="photo">FOTO</button>
            </div>
          </div>
        </div>

        <!-- THUMBNAIL STRIP -->
        <div class="thumb-strip-container">
          <div id="thumbStrip" class="thumb-strip">
            <div class="thumb-empty">Sin páginas aún</div>
          </div>
        </div>
      </section>

      <!-- ===== PREVIEW / EDIT VIEW ===== -->
      <section id="previewView" class="view">

        <!-- TOP BAR: discard | page counter | save only -->
        <div class="preview-toolbar">
          <button id="btnBackToCamera" class="tool-btn danger-txt">✕ Descartar</button>
          <span class="preview-title-wrap">
            <span id="previewTitle">Página</span>
            <span id="previewPageNum" class="page-num-badge">1</span>
          </span>
          <button id="btnConfirmPage" class="tool-btn">💾 Guardar</button>
        </div>

        <!-- CANVAS AREA -->
        <div class="preview-canvas-wrap">
          <canvas id="previewCanvas"></canvas>
          <div id="correctionBadge" class="correction-badge hidden">
            <span>✓</span> Encuadre corregido automáticamente
          </div>
        </div>

        <!-- ★ SIGUIENTE PÁGINA — PRIMARY ACTION ★ -->
        <div class="next-page-bar">
          <div class="scan-counter-row">
            <span id="savedSoFar">0 páginas guardadas</span>
          </div>
          <button id="btnNextPage" class="next-page-btn" type="button">
            <span class="np-icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="12" y1="18" x2="12" y2="12"></line>
                <line x1="9" y1="15" x2="15" y2="15"></line>
              </svg>
            </span>
            <span class="np-text">SIGUIENTE PÁGINA</span>
            <span class="np-sub">Guarda y continúa escaneando</span>
          </button>
          <div class="quick-actions-row">
            <button class="edit-btn" id="btnRotLeft" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
              Rotar izq
            </button>
            <button class="edit-btn" id="btnRotRight" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
              Rotar der
            </button>
            <button class="edit-btn" id="btnFilter" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 1 0 20z"></path></svg>
              Filtro
            </button>
            <button class="edit-btn" id="btnCrop" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"></path><path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"></path></svg>
              Recortar
            </button>
            <button class="edit-btn" id="btnBright" type="button" title="Brillo">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <button class="edit-btn" id="btnContrast" type="button" title="Contraste">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 18a6 6 0 0 0 0-12v12z"></path></svg>
            </button>
          </div>
        </div>

        <div id="filterPanel" class="filter-panel hidden">
          <button class="filter-opt active" data-filter="document">📄 Documento</button>
          <button class="filter-opt" data-filter="whiteboard">🖍️ Pizarra</button>
          <button class="filter-opt" data-filter="magic">✨ Mágico</button>
          <button class="filter-opt" data-filter="grayscale">🩶 Gris</button>
          <button class="filter-opt" data-filter="bw">⬛ B&N Puro</button>
          <button class="filter-opt" data-filter="original">📷 Original</button>
        </div>
        <div id="sliderPanel" class="slider-panel hidden">
          <label id="sliderLabel">Brillo</label>
          <input type="range" id="adjSlider" min="-100" max="100" value="0" />
          <span id="sliderVal">0</span>
          <button class="edit-btn small" id="btnApplyAdj">Aplicar</button>
          <button class="edit-btn small" id="btnResetAdj">Reset</button>
        </div>
      </section>

      <!-- ===== PAGES MANAGER VIEW ===== -->
      <section id="pagesView" class="view">
        <div class="preview-toolbar">
          <button id="btnBackFromPages" class="tool-btn">← Volver</button>
          <span>Páginas (<span id="totalPagesCount">0</span>)</span>
          <button id="btnDeleteAll" class="tool-btn danger">🗑 Borrar todo</button>
        </div>
        <div id="pagesGrid" class="pages-grid"></div>
        <div class="pages-actions">
          <div class="filename-row">
            <label>📝 Nombre del archivo:</label>
            <input type="text" id="fileNameInput" placeholder="Mi_Documento" maxlength="60" />
          </div>
          <div class="action-row">
            <button id="btnAddMorePages" class="action-btn secondary">
              ➕ Agregar página
            </button>
            <button id="btnExportPDF" class="action-btn primary">
              📥 Exportar PDF
            </button>
          </div>
          <div class="action-row">
            <button id="btnExportJPG" class="action-btn secondary">
              🖼️ Guardar JPGs
            </button>
            <button id="btnSharePDF" class="action-btn share">
              📤 Compartir PDF
            </button>
          </div>
        </div>
      </section>

    </main>

    <!-- ===== CROP & PERSPECTIVE ADJUST MODAL (LUPA / ONEDRIVE STYLE) ===== -->
    <div id="cropModal" class="modal hidden">
      <div class="modal-content crop-modal-content">
        <div class="modal-header">
          <span>Ajustar esquinas</span>
          <button id="btnCloseCrop">✕</button>
        </div>
        <div class="crop-editor-container" id="cropEditorContainer">
          <canvas id="cropCanvas"></canvas>
          <!-- SVG polygon connecting the 4 handles -->
          <svg id="cropSvgOverlay" class="crop-svg-overlay">
            <polygon id="cropPolygon" points="0,0 0,0 0,0 0,0" />
            <line id="cropLine1" class="crop-poly-line" />
            <line id="cropLine2" class="crop-poly-line" />
            <line id="cropLine3" class="crop-poly-line" />
            <line id="cropLine4" class="crop-poly-line" />
          </svg>
          <!-- 4 movable Corner handles -->
          <div class="corner-pin" id="pinTL" data-corner="tl"></div>
          <div class="corner-pin" id="pinTR" data-corner="tr"></div>
          <div class="corner-pin" id="pinBR" data-corner="br"></div>
          <div class="corner-pin" id="pinBL" data-corner="bl"></div>
          <!-- Corner Magnifier (Lupa OneDrive) -->
          <div id="magnifier" class="crop-magnifier hidden">
            <canvas id="magnifierCanvas" width="130" height="130"></canvas>
            <div class="magnifier-crosshair"></div>
          </div>
        </div>
        <div class="crop-modal-footer">
          <button id="btnResetCrop" class="edit-btn">Reajustar bordes</button>
          <button id="btnApplyCrop" class="edit-btn primary">Listo ✓</button>
        </div>
      </div>
    </div>

    <!-- ===== PAGE EDIT MODAL ===== -->
    <div id="pageEditModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <span>Editar página <span id="modalPageNum">1</span></span>
          <button id="btnCloseModal">✕</button>
        </div>
        <div class="modal-canvas-wrap">
          <canvas id="modalCanvas"></canvas>
        </div>
        <div class="modal-tools">
          <button class="edit-btn" id="mBtnRotL">↺ Izq</button>
          <button class="edit-btn" id="mBtnRotR">↻ Der</button>
          <button class="edit-btn" id="mBtnDelete" style="color:#ff4444">🗑 Eliminar</button>
          <button class="edit-btn primary" id="mBtnSave">✓ OK</button>
        </div>
        <div class="modal-filters">
          <button class="filter-opt" data-mfilter="original">Original</button>
          <button class="filter-opt" data-mfilter="bw">B&N</button>
          <button class="filter-opt" data-mfilter="grayscale">Gris</button>
          <button class="filter-opt" data-mfilter="enhance">Mejorar</button>
          <button class="filter-opt" data-mfilter="magic">Mágico</button>
        </div>
      </div>
    </div>

    <!-- ===== SETTINGS MODAL ===== -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <span>⚙️ Configuración</span>
          <button id="btnCloseSettings">✕</button>
        </div>
        <div class="settings-body">
          <div class="setting-item">
            <label>Calidad PDF</label>
            <select id="pdfQuality">
              <option value="0.6">Baja (archivos pequeños)</option>
              <option value="0.8" selected>Media (recomendado)</option>
              <option value="0.95">Alta (mejor calidad)</option>
              <option value="1.0">Máxima</option>
            </select>
          </div>
          <div class="setting-item">
            <label>Detección automática</label>
            <label class="toggle">
              <input type="checkbox" id="autoDetectToggle" checked />
              <span class="slider-toggle"></span>
            </label>
          </div>
          <div class="setting-item">
            <label>Corrección de perspectiva</label>
            <label class="toggle">
              <input type="checkbox" id="perspToggle" checked />
              <span class="slider-toggle"></span>
            </label>
          </div>
          <div class="setting-item">
            <label>Versión de la app</label>
            <span style="color:#888">1.0.0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== PROGRESS / EXPORT OVERLAY ===== -->
    <div id="exportOverlay" class="modal hidden">
      <div class="modal-content small">
        <div class="export-progress">
          <div class="spinner"></div>
          <p id="exportMsg">Generando PDF...</p>
          <div class="progress-bar"><div id="progressFill"></div></div>
        </div>
      </div>
    </div>

    <!-- FILE INPUT hidden -->
    <input type="file" id="galleryInput" accept="image/*" capture="environment" multiple style="display:none" />

  </div><!-- /app -->

  <!-- jsPDF CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(r => console.log('SW registrado'))
          .catch(e => console.log('SW error', e));
      });
    }
  </script>
</body>
</html>
